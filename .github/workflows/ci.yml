# The workflow name is the label on the README's badge.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      # Keep the other platforms running when one exposes a regression.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # The lockfile must already match pyproject.toml; CI never re-resolves.
      - name: Check the lockfile
        run: uv lock --check

      # The dev group includes the 'evo' extra (evosax) so the cma-es retriever
      # is tested.
      - name: Install dependencies
        run: uv sync --frozen --group dev

      # Only Linux needs these system packages and a virtual display.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 xvfb

      # Exactly the local definition-of-done gate (AGENTS.md): lint, format,
      # types, then the suite under xdist with the coverage threshold.
      # `ruff check --fix` and `ruff format` rewrite files here too, so the
      # gate fails if they changed anything.
      - name: Gate (poe check)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run poe check
          else
            uv run poe check
          fi
          git diff --exit-code

      # Tokenless upload works for public repos; set CODECOV_TOKEN in the repo
      # secrets to avoid rate limits (see the release checklist).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/coverage.xml
          name: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # Keep the check name required by the main branch's repository ruleset.
  lint-type-test:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          MATRIX_RESULT: ${{ needs.checks.result }}
        run: test "$MATRIX_RESULT" = "success"
